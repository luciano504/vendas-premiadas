name: Atualizar Vendas Premiadas (desligado)

# A carga agendada roda no repo rendemais-aves (workflow "Vendas Premiadas (VR -> Supabase)"),
# que já tem as chaves cadastradas. Este fica só para disparo manual, caso um dia
# os secrets sejam cadastrados aqui também.
on:
  workflow_dispatch: {}

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas requests
      - name: VR -> Supabase
        env:
          VR_URL: ${{ secrets.VR_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scripts/atualizar.py
