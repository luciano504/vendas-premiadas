<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vendas Premiadas</title>
<meta name="theme-color" content="#1F3864">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{
  color-scheme:light;
  --navy:#1F3864; --amber:#FFBF00;
  --plane:#f2f3f6; --surface:#fff; --surface-2:#f7f8fa;
  --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --baseline:#c3c2b7;
  --good:#0ca30c; --good-text:#006300; --warning:#b07a00; --critical:#d03b3b;
  --bar:#2a78d6; --radius:14px;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  color-scheme:dark; --plane:#0d0d0d; --surface:#1a1a19; --surface-2:#211f1e;
  --ink:#fff; --ink-2:#c3c2b7; --muted:#898781; --grid:#2c2c2a; --baseline:#383835;
  --good-text:#2fc22f; --warning:#fab219; --bar:#3987e5;
}}
:root[data-theme="dark"]{
  color-scheme:dark; --plane:#0d0d0d; --surface:#1a1a19; --surface-2:#211f1e;
  --ink:#fff; --ink-2:#c3c2b7; --muted:#898781; --grid:#2c2c2a; --baseline:#383835;
  --good-text:#2fc22f; --warning:#fab219; --bar:#3987e5;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--plane);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
header.top{background:var(--navy);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20}
header.top .dot{width:11px;height:11px;border-radius:50%;background:var(--amber)}
header.top b{font-size:17px}
header.top .sp{flex:1}
header.top .who{font-size:13px;opacity:.85}
header.top button{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:8px;padding:6px 10px;cursor:pointer}
main{max-width:1100px;margin:0 auto;padding:16px}
.card{background:var(--surface);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:0 1px 0 rgba(0,0,0,.04)}
h2{font-size:20px;margin:0 0 4px} h3{font-size:16px;margin:0 0 10px}
.desc{color:var(--ink-2);font-size:13px;margin:0}
.muted{color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--grid);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.btn{background:var(--navy);color:#fff;border:0;border-radius:9px;padding:9px 14px;font-weight:600;cursor:pointer}
.btn.sec{background:var(--surface-2);color:var(--ink);border:1px solid var(--grid)}
.btn.amb{background:var(--amber);color:#1b1b1b}
.btn:disabled{opacity:.5;cursor:default}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}
.kpi{background:var(--surface-2);border-radius:12px;padding:10px 12px}
.kpi .l{font-size:12px;color:var(--ink-2)} .kpi .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted)}
@media (max-width:640px){ .kpis{grid-template-columns:repeat(2,1fr)} }
.lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.camp{background:var(--surface);border-radius:var(--radius);padding:14px;cursor:pointer;border:2px solid transparent}
.camp:hover{border-color:var(--navy)}
.camp .t{font-weight:700;font-size:16px}
.pill{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;background:var(--surface-2);color:var(--ink-2)}
.pill.ok{color:var(--good-text)} .pill.warn{color:var(--warning)} .pill.bad{color:var(--critical)}
.tbl-wrap{max-height:70vh;overflow-y:auto;border-radius:10px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;table-layout:auto}
th,td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--grid);font-size:14px}
th{position:sticky;top:0;background:var(--surface);z-index:2;font-size:12px;color:var(--ink-2);font-weight:600}
th:first-child,td:first-child,th.l,td.l{text-align:left}
tr.lider td{font-weight:700}
.lojaB{display:inline-block;color:#fff;border-radius:6px;padding:1px 6px;font-size:12px;font-weight:700;margin-right:6px}
.bar{position:relative;height:10px;background:var(--surface-2);border-radius:6px;min-width:70px;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--bar);border-radius:6px}
.bar b{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink)}
@media (max-width:640px){ .hm{display:none} th,td{padding:7px 4px;font-size:13px} }
.aviso{background:#fff6d6;color:#5a4300;border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px}
:root[data-theme="dark"] .aviso{background:#3a3000;color:#ffe9a6}
.erro{background:#fde7e7;color:#7a1414}
pre.wa{white-space:pre-wrap;background:var(--surface-2);border-radius:10px;padding:12px;font-size:13px;margin:0 0 8px}
svg text{fill:var(--ink-2);font-size:11px}
/* login */
#login{position:fixed;inset:0;display:none;place-items:center;background:var(--navy);padding:16px;z-index:50}
#login .box{background:var(--surface);border-radius:16px;padding:22px;width:min(360px,100%);text-align:center}
#login input{width:100%;padding:11px;border:1px solid var(--grid);border-radius:10px;margin:6px 0;background:var(--surface)}
#lgSwitch{font-size:13px;color:var(--bar);cursor:pointer;margin-top:8px}
/* editor */
dialog{border:0;border-radius:16px;padding:0;width:min(860px,96vw);max-height:92vh;background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.ed{padding:18px;overflow-y:auto;max-height:80vh}
.ed h4{margin:16px 0 6px;font-size:14px;color:var(--navy)}
:root[data-theme="dark"] .ed h4{color:var(--amber)}
.ed label{display:block;font-size:12px;color:var(--ink-2);margin-bottom:3px}
.ed input,.ed select{width:100%;padding:8px;border:1px solid var(--grid);border-radius:8px;background:var(--surface)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px} .g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:640px){ .g2,.g3{grid-template-columns:1fr} }
.grp{display:grid;grid-template-columns:1.3fr 1.6fr .7fr .7fr auto;gap:6px;align-items:end;padding:8px 0;border-bottom:1px dashed var(--grid)}
@media (max-width:640px){ .grp{grid-template-columns:1fr 1fr} }
.grp .nm{grid-column:1/-1;font-size:11px;color:var(--muted);margin-top:-2px}
.edfoot{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--grid)}
.x{background:none;border:0;color:var(--critical);font-size:18px;cursor:pointer}
.check{display:flex;align-items:center;gap:8px;font-size:14px;margin:4px 0}
.check input{width:auto}
</style>
</head>
<body>
<div id="login"><div class="box">
  <div style="font-size:34px">🏆</div>
  <h2>Vendas Premiadas</h2>
  <p class="desc" style="margin-bottom:12px">Entre com o mesmo usuário e PIN do Data Crítica.</p>
  <div id="lgUserWrap"></div>
  <input id="lgPin" type="password" inputmode="numeric" placeholder="PIN" autocomplete="off">
  <button class="btn" style="width:100%;margin-top:6px" onclick="entrar()">Entrar</button>
  <div id="lgMsg" style="color:var(--critical);font-size:13px;min-height:18px;margin-top:6px"></div>
  <div id="lgSwitch"></div>
</div></div>

<header class="top" id="hdr" hidden>
  <span class="dot"></span><b>Vendas Premiadas</b>
  <span class="sp"></span>
  <span class="who" id="hdWho"></span>
  <button onclick="tema()" title="Tema">◐</button>
  <button onclick="sair()">Sair</button>
</header>
<main id="app" hidden></main>

<dialog id="dlg"><div class="ed" id="edBody"></div>
  <div class="edfoot">
    <button class="btn sec" onclick="$('dlg').close()">Cancelar</button>
    <button class="btn" id="edSalvar" onclick="salvarCampanha()">Salvar campanha</button>
  </div>
</dialog>

<script>
/* ==============================================================
   VENDAS PREMIADAS — campanhas de venda de itens por loja.
   As regras ficam em cv_campanhas.config; a venda por loja/dia/grupo
   vem do VR pelo workflow (cv_vendas) e a base da meta em cv_base.
   Pontos, metas e prêmios são calculados AQUI, com a regra vigente.
   ============================================================== */
const SB_URL = "https://estciwkeihmokvlnvaum.supabase.co";
const SB_KEY = "sb_publishable_l14fjxQmWUeu5OXlZJ35GA_-X3ESkgZ";
const LOJAS = {1:"L01 Veneza",2:"L02 Máximo",3:"L03 Royal",4:"L04 Lojão",5:"L05 Alvorada",8:"L08 Tradição",9:"L09 Massangana"};
const LOJA_COR = {1:"#1976D2",2:"#388E3C",3:"#C2185B",4:"#E91E63",5:"#F57C00",8:"#7B1FA2",9:"#00838F"};
const MESES = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const $ = id => document.getElementById(id);
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num = (v,d=0) => v==null||!isFinite(v) ? "—" : Number(v).toLocaleString("pt-BR",{minimumFractionDigits:d,maximumFractionDigits:d});
const brl = v => v==null ? "—" : Number(v).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const pct = v => v==null||!isFinite(v) ? "—" : num(v*100,0)+"%";
const lojaB = l => `<span class="lojaB" style="background:${LOJA_COR[l]||"#607D8B"}">L${String(l).padStart(2,"0")}</span>`;
const lojaNome = l => (LOJAS[l]||("Loja "+l)).replace(/^L\d+ /,"");

/* ------------------------------ tema */
function tema(){
  const r=document.documentElement, at=r.getAttribute("data-theme");
  const escuro = at ? at==="dark" : matchMedia("(prefers-color-scheme:dark)").matches;
  r.setAttribute("data-theme", escuro?"light":"dark");
  try{ localStorage.setItem("vpTema", r.getAttribute("data-theme")); }catch(e){}
}
try{ const t=localStorage.getItem("vpTema"); if(t) document.documentElement.setAttribute("data-theme",t); }catch(e){}

/* ------------------------------ Supabase */
const HDR = {apikey:SB_KEY, Authorization:"Bearer "+SB_KEY};
async function sbTudo(path){
  const out=[];
  for(let ini=0; ini<500000; ini+=1000){
    const r = await fetch(SB_URL+"/rest/v1/"+path,{headers:{...HDR, Range:ini+"-"+(ini+999)}});
    if(!r.ok) throw new Error(await r.text());
    const b = await r.json(); out.push(...b);
    if(b.length<1000) break;
  }
  return out;
}
async function sbGrava(metodo, path, corpo){
  const r = await fetch(SB_URL+"/rest/v1/"+path,{method:metodo,
    headers:{...HDR,"Content-Type":"application/json",Prefer:"return=representation"},body:JSON.stringify(corpo)});
  if(!r.ok) throw new Error(await r.text());
  return r.json();
}

/* ------------------------------ login (mesmo cadastro do Data Crítica) */
let sess=null, lgOutra=false;
const normNome = s => String(s||"").trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
async function sha256(t){ const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); }
function ultimoNome(){ try{ return localStorage.getItem("vpUltimoNome")||""; }catch(e){ return ""; } }
async function iniciarLogin(){
  $("login").style.display="grid";
  try{ window.__users = (await sbTudo("usuarios?select=id,nome,papel,loja,pin_hash&ativo=eq.true&order=nome")).filter(u=>u.papel!=="fornecedor"); }
  catch(e){ $("lgMsg").textContent="Não consegui falar com o banco. Verifique a internet."; }
  desenharLogin();
}
function desenharLogin(){
  const ult=ultimoNome(), outra=lgOutra||!ult;
  $("lgUserWrap").innerHTML = outra
    ? `<input id="lgNome" placeholder="Seu nome" autocomplete="off">`
    : `<div style="background:var(--surface-2);border-radius:10px;padding:10px;margin-bottom:6px"><b>${esc(ult)}</b><div class="desc">Digite o PIN para entrar</div></div><input type="hidden" id="lgNome" value="${esc(ult)}">`;
  $("lgSwitch").textContent = outra ? (ult?"‹ Voltar para "+ult:"") : "Sou outra pessoa";
  $("lgSwitch").onclick = ()=>{ lgOutra=!outra; desenharLogin(); };
}
async function entrar(){
  const nome=($("lgNome")||{}).value||"", pin=$("lgPin").value.trim();
  if(!nome.trim()||pin.length<4){ $("lgMsg").textContent="Informe seu nome e o PIN."; return; }
  if(!window.crypto?.subtle){ $("lgMsg").textContent="Abra o app por HTTPS."; return; }
  const ach=(window.__users||[]).filter(u=>normNome(u.nome)===normNome(nome));
  if(!ach.length){ $("lgMsg").textContent="Usuário não encontrado."; return; }
  const h=await sha256(pin), u=ach.find(x=>x.pin_hash===h);
  if(!u){ $("lgMsg").textContent="PIN incorreto."; return; }
  sess={id:u.id,nome:u.nome,papel:u.papel,loja:u.loja};
  try{ localStorage.setItem("vpSess",JSON.stringify(sess)); localStorage.setItem("vpUltimoNome",u.nome); }catch(e){}
  abrirApp();
}
function sair(){ try{ localStorage.removeItem("vpSess"); }catch(e){} location.reload(); }
const podeEditar = () => sess && sess.papel==="gestor";
function abrirApp(){
  $("login").style.display="none"; $("hdr").hidden=false; $("app").hidden=false;
  $("hdWho").textContent = sess.nome.split(" ")[0]+" · "+({gestor:"Gestor",prevencao:"Prevenção",operador:"Loja"}[sess.papel]||sess.papel);
  carregarLista();
}

/* ------------------------------ datas e rodadas (mesma regra do workflow) */
const iso = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const dt = s => { const [a,m,d]=String(s).slice(0,10).split("-").map(Number); return new Date(a,m-1,d); };
const ultDia = (a,m) => new Date(a,m+1,0).getDate();     // m base 0
const hojeD = () => { const n=new Date(); return new Date(n.getFullYear(),n.getMonth(),n.getDate()); };
const diasEntre = (a,b) => Math.round((b-a)/864e5)+1;
const ddmm = d => String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0");
function rodadas(cfg){
  const hoje=hojeD(), ini=dt(cfg.inicio), out=[];
  if((cfg.recorrencia||"mensal")==="mensal"){
    const fimC = cfg.fim ? dt(cfg.fim) : null;
    let d=new Date(ini.getFullYear(),ini.getMonth(),1);
    while(d<=hoje && (!fimC||d<=fimC)){
      let f=new Date(d.getFullYear(),d.getMonth(),ultDia(d.getFullYear(),d.getMonth()));
      if(fimC&&f>fimC) f=fimC;
      out.push({id:iso(d).slice(0,7), ini:d<ini?ini:d, fim:f, nome:MESES[d.getMonth()]+"/"+d.getFullYear()});
      d=new Date(d.getFullYear(),d.getMonth()+1,1);
    }
  }else if(cfg.fim && ini<=hoje){
    out.push({id:"unica", ini, fim:dt(cfg.fim), nome:ddmm(ini)+" a "+ddmm(dt(cfg.fim))});
  }
  return out;
}

/* ------------------------------ estado */
let CAMPS=[], PRODS={}, SEL=null, DADOS=null, RODADA=null;

async function carregarLista(){
  $("app").innerHTML = `<div class="card muted">Carregando campanhas…</div>`;
  try{
    CAMPS = await sbTudo("cv_campanhas?select=*&order=ativa.desc,id.desc");
    (await sbTudo("cv_produtos?select=id,descricao")).forEach(p=>PRODS[p.id]=p.descricao);
  }catch(e){
    $("app").innerHTML = `<div class="card aviso erro"><b>Não consegui ler as campanhas.</b><br>Se for a primeira vez, falta rodar o setup.sql no Supabase.<br><small>${esc(String(e.message).slice(0,200))}</small></div>`;
    return;
  }
  const h = new URLSearchParams(location.hash.slice(1));
  if(h.get("c") && CAMPS.find(c=>String(c.id)===h.get("c"))) return abrirCampanha(Number(h.get("c")), h.get("r"));
  desenharLista();
}
function desenharLista(){
  history.replaceState(null,"",location.pathname);
  SEL=null;
  const card = c => {
    const cfg=c.config, r=rodadas(cfg), atual=r[r.length-1];
    const st = !c.ativa ? `<span class="pill">encerrada</span>`
      : c.ultimo_erro ? `<span class="pill bad">erro na carga</span>`
      : `<span class="pill ok">ativa</span>`;
    return `<div class="camp" onclick="abrirCampanha(${c.id})">
      <div class="row" style="justify-content:space-between"><span class="t">${esc(cfg.icone||"🏆")} ${esc(c.nome)}</span>${st}</div>
      <p class="desc" style="margin-top:6px">${(cfg.grupos||[]).map(g=>esc(g.nome)+" <b>"+num(g.peso,g.peso%1?1:0)+" pt</b>").join(" · ")}</p>
      <p class="desc muted" style="margin-top:4px">${cfg.recorrencia==="mensal"?"Mensal":"Período único"} · ${(cfg.lojas||[]).length} lojas${atual?" · rodada "+esc(atual.nome):""}</p>
    </div>`;
  };
  const at=CAMPS.filter(c=>c.ativa), enc=CAMPS.filter(c=>!c.ativa);
  $("app").innerHTML = `
    <div class="row" style="justify-content:space-between;margin-bottom:12px">
      <div><h2>Campanhas de venda</h2><p class="desc">Competição entre lojas por itens específicos. Ranking pelo % da meta de cada loja.</p></div>
      ${podeEditar()?`<button class="btn amb" onclick="editar(null)">+ Nova campanha</button>`:""}
    </div>
    ${at.length?`<div class="lista">${at.map(card).join("")}</div>`:`<div class="card muted">Nenhuma campanha ativa.</div>`}
    ${enc.length?`<h3 style="margin-top:20px">Encerradas</h3><div class="lista">${enc.map(card).join("")}</div>`:""}`;
}

async function abrirCampanha(id, rod){
  SEL = CAMPS.find(c=>c.id===id);
  $("app").innerHTML = `<div class="card muted">Carregando ${esc(SEL.nome)}…</div>`;
  const [v,b] = await Promise.all([
    sbTudo(`cv_vendas?select=loja,dia,grupo,qtd,qtd_oferta,valor&campanha_id=eq.${id}&order=dia`),
    sbTudo(`cv_base?select=rodada,modo,loja,grupo,qtd,qtd_oferta,dias,ini,fim&campanha_id=eq.${id}`)
  ]);
  DADOS={vendas:v, base:b};
  const rs = rodadas(SEL.config);
  RODADA = rs.find(r=>r.id===rod) || rs[rs.length-1] || null;
  desenharCampanha();
}

/* ------------------------------ o cálculo */
function calcular(cfg, rod){
  const grupos = Object.fromEntries((cfg.grupos||[]).map(g=>[g.id,g]));
  const contaOferta = cfg.regras?.contar_oferta!==false;
  const q = x => contaOferta ? Number(x.qtd) : Number(x.qtd)-Number(x.qtd_oferta);
  const pts = x => grupos[x.grupo] ? q(x)*Number(grupos[x.grupo].peso||0) : 0;
  const ini=iso(rod.ini), fim=iso(rod.fim), hoje=hojeD();
  const totDias = diasEntre(rod.ini,rod.fim);
  const corrDias = hoje>rod.fim ? totDias : Math.max(0, diasEntre(rod.ini,hoje));
  const fechada = hoje>rod.fim;
  const meta = cfg.meta||{};
  const temMeta = !meta.a_partir || rod.id==="unica" || rod.id>=meta.a_partir;
  const modos = meta.modo==="maior" ? ["anterior","ano_passado"] : [meta.modo||"anterior"];
  const lojas = (cfg.lojas||[]).map(Number);
  const vRod = DADOS.vendas.filter(x=>x.dia>=ini && x.dia<=fim);
  const ultimoDiaComVenda = vRod.reduce((m,x)=>x.dia>m?x.dia:m,"");

  const linhas = lojas.map(l=>{
    const vl = vRod.filter(x=>x.loja===l);
    const P = vl.reduce((s,x)=>s+pts(x),0);
    const porGrupo = {}; (cfg.grupos||[]).forEach(g=>porGrupo[g.id]=0);
    vl.forEach(x=>{ if(porGrupo[x.grupo]!=null) porGrupo[x.grupo]+=q(x); });
    // base e meta
    let base=null, baseInfo="";
    modos.forEach(m=>{
      const bl = DADOS.base.filter(x=>x.rodada===rod.id && x.modo===m && x.loja===l);
      if(!bl.length) return;
      let bp = bl.reduce((s,x)=>s+pts(x),0);
      if(rod.id==="unica"){ const d=bl[0].dias||totDias; bp = bp*totDias/d; }
      if(base==null || bp>base){ base=bp; baseInfo=m; }
    });
    let M=null;
    const fixa = meta.fixas && meta.fixas[l];
    if(temMeta){
      if(fixa) M=Number(fixa);
      else if(base!=null) M=Math.max(base*(1+Number(meta.crescimento||0)/100), Number(meta.minimo||0));
      if(M!=null && M<=0) M=null;
    }
    const esperado = M!=null ? M*corrDias/totDias : null;
    const bateu = M!=null && P>=M;
    const vp = Number(cfg.premio?.valor_ponto||0), bonus=Number(cfg.premio?.bonus_meta||0);
    let premio = P*vp;
    if(cfg.regras?.premio_so_com_meta && !bateu) premio=0;
    if(bateu) premio+=bonus;
    // série acumulada por dia
    const serie=[]; let ac=0;
    for(let i=0;i<corrDias;i++){
      const d=iso(new Date(rod.ini.getFullYear(),rod.ini.getMonth(),rod.ini.getDate()+i));
      ac += vl.filter(x=>x.dia===d).reduce((s,x)=>s+pts(x),0);
      serie.push(ac);
    }
    return {loja:l, P, porGrupo, base, baseInfo, meta:M, fixa:!!fixa, esperado,
            pMeta: M? P/M : null, ritmo: esperado? P/esperado : null, bateu, premio, serie};
  });
  linhas.sort((a,b)=>((b.pMeta??-1)-(a.pMeta??-1)) || (b.P-a.P));
  linhas.forEach((x,i)=>x.pos=i+1);
  const tot = {
    P: linhas.reduce((s,x)=>s+x.P,0),
    meta: linhas.every(x=>x.meta!=null) ? linhas.reduce((s,x)=>s+x.meta,0) : null,
    premio: linhas.reduce((s,x)=>s+x.premio,0),
    bateram: linhas.filter(x=>x.bateu).length
  };
  tot.pMeta = tot.meta? tot.P/tot.meta : null;
  tot.ritmo = tot.meta? tot.P/(tot.meta*corrDias/totDias||1) : null;
  return {linhas, tot, totDias, corrDias, fechada, temMeta, ultimoDiaComVenda};
}

function topoCampanha(c,rs){

    <div><button class="btn sec" onclick="desenharLista()">‹ Campanhas</button></div>

}
function trocarRodada(id){ RODADA=rodadas(SEL.config).find(r=>r.id===id); desenharCampanha(); }

function grafico(R){
  const L=R.linhas.filter(x=>x.meta), n=R.totDias;
  if(!L.length || !R.corrDias) return `<p class="desc muted">O gráfico aparece quando houver meta e venda na rodada.</p>`;
  const W=760,H=240,pl=36,pr=12,pt=10,pb=24;
  const maxY=Math.max(1.2, ...L.map(x=>x.serie.length? x.serie[x.serie.length-1]/x.meta:0))*1.05;
  const X=i=>pl+(W-pl-pr)*(n<=1?1:i/(n-1)), Y=v=>pt+(H-pt-pb)*(1-v/maxY);
  let g="";
  [0,.5,1,1.5,2].filter(v=>v<=maxY).forEach(v=>{ g+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)" ${v===1?'stroke-dasharray="4 3" stroke="var(--baseline)"':""}/><text x="${pl-6}" y="${Y(v)+4}" text-anchor="end">${v*100}%</text>`; });
  g+=`<line x1="${X(0)}" y1="${Y(1/n)}" x2="${X(n-1)}" y2="${Y(1)}" stroke="var(--ink-2)" stroke-dasharray="2 4"/>`;
  [1,Math.ceil(n/2),n].forEach(d=>g+=`<text x="${X(d-1)}" y="${H-6}" text-anchor="middle">dia ${d}</text>`);
  L.forEach(x=>{
    const pts=x.serie.map((v,i)=>X(i).toFixed(1)+","+Y(v/x.meta).toFixed(1)).join(" ");
    const lx=X(x.serie.length-1), ly=Y(x.serie[x.serie.length-1]/x.meta);
    g+=`<polyline points="${pts}" fill="none" stroke="${LOJA_COR[x.loja]}" stroke-width="2"><title>${esc(LOJAS[x.loja])}</title></polyline><circle cx="${lx}" cy="${ly}" r="3" fill="${LOJA_COR[x.loja]}"/>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="Evolução do percentual da meta por loja">${g}</svg>
    <div class="chips" style="margin-top:6px">${L.map(x=>`<span style="font-size:12px">${lojaB(x.loja)}${esc(lojaNome(x.loja))}</span>`).join("")}
    <span class="desc muted">· pontilhado = ritmo para chegar a 100%</span></div>`;
}
function textoWA(c,R){
  const cfg=c.config, med=["🥇","🥈","🥉"];
  const cab = `${cfg.icone||"🏆"} *${c.nome.toUpperCase()}* — ${RODADA.nome}\n`
    + (R.fechada?"*Resultado final*\n":`Parcial até ${R.ultimoDiaComVenda?ddmm(dt(R.ultimoDiaComVenda)):"hoje"} (dia ${R.corrDias} de ${R.totDias})\n`);
  const lin = R.linhas.map((x,i)=>`${med[i]||(i+1)+"º"} ${lojaNome(x.loja)} — ${num(x.P)} pts`
    + (x.meta?` · ${pct(x.pMeta)} da meta${x.bateu?" ✅":""}`:"")).join("\n");
  const rede = `\n\nRede: ${num(R.tot.P)} pts`+(R.tot.meta?` · ${pct(R.tot.pMeta)} da meta`:"")
    + (!R.fechada&&R.tot.ritmo?` · ritmo ${pct(R.tot.ritmo)}`:"");
  const corre = !R.fechada ? "\n\n"+R.linhas.filter(x=>x.ritmo!=null&&x.ritmo<1&&x.meta).map(x=>`⚡ ${lojaNome(x.loja)}: faltam ${num(Math.max(0,x.meta-x.P))} pts para a meta`).slice(0,3).join("\n") : "";
  return cab+"\n"+lin+rede+corre;
}
async function copiarWA(b){
  try{ await navigator.clipboard.writeText($("waTxt").textContent); b.textContent="Copiado ✓"; }
  catch(e){ const r=document.createRange(); r.selectNodeContents($("waTxt")); getSelection().removeAllRanges(); getSelection().addRange(r); b.textContent="Selecionado — copie com Ctrl+C"; }
  setTimeout(()=>b.textContent="Copiar texto",2500);
}

async function salvarCampanha(){
  lerEditor();
  const c=ED.cfg, erro = !ED.nome ? "Dê um nome à campanha."
    : !c.inicio ? "Informe o início." : (c.recorrencia==="unica"&&!c.fim) ? "Período único precisa de data de fim."
    : (c.fim&&c.fim<c.inicio) ? "O fim está antes do início." : !c.lojas.length ? "Marque ao menos uma loja."
    : !c.grupos.length || c.grupos.some(g=>!g.nome||!g.codigos.length) ? "Cada grupo precisa de nome e de pelo menos um código."
    : c.grupos.some(g=>g.peso<=0) ? "Peso tem de ser maior que zero." : "";
  if(erro){ $("edMsg").textContent=erro; return; }
  c.grupos.forEach(g=>{ if(!ED.travados.has(g.id) && /^g\d+$|^g[a-z0-9]+$/.test(g.id)){
    const base=normNome(g.nome).replace(/[^a-z0-9]+/g,"_").replace(/^_|_$/g,"").slice(0,24)||"grupo";
    let id=base,k=2; while(c.grupos.some(o=>o!==g&&o.id===id)) id=base+"_"+(k++); g.id=id; }});
  $("edSalvar").disabled=true;
  try{
    const corpo={nome:ED.nome, ativa:ED.ativa, config:c, atualizado_em:new Date().toISOString(), atualizado_por:sess.nome};
    const r = ED.id ? await sbGrava("PATCH","cv_campanhas?id=eq."+ED.id,corpo) : await sbGrava("POST","cv_campanhas",corpo);
    const salvo=r[0]; const i=CAMPS.findIndex(x=>x.id===salvo.id);
    if(i>=0) CAMPS[i]=salvo; else CAMPS.unshift(salvo);
    $("dlg").close();
    if(SEL && SEL.id===salvo.id){ SEL=salvo; RODADA=rodadas(salvo.config).find(x=>RODADA&&x.id===RODADA.id)||rodadas(salvo.config).pop()||null; desenharCampanha(); }
    else abrirCampanha(salvo.id);
  }catch(e){ $("edMsg").textContent="Não salvou: "+String(e.message).slice(0,160); }
  finally{ $("edSalvar").disabled=false; }
}

/* ------------------------------ início */
(function(){
  try{ const s=JSON.parse(localStorage.getItem("vpSess")||"null"); if(s&&s.id){ sess=s; return abrirApp(); } }catch(e){}
  iniciarLogin();
})();
setInterval(()=>{ if(SEL && document.visibilityState==="visible" && !$("dlg").open) abrirCampanha(SEL.id, RODADA&&RODADA.id); }, 10*60*1000);
</script>
